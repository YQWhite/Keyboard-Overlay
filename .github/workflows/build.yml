name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # 强制使用 Windows 运行环境进行打包
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # 使用稳定的 Python 3.11

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 websockets keyboard pyinstaller

    - name: 运行 PyInstaller 打包
      # 注意：在 YAML 中为了兼容性，建议将打包命令写在同一行
      run: |
        pyinstaller --noconfirm --onefile --windowed --add-data "index.html;." --add-data "config.html;." --add-data "config.json;." --add-data "stats.json;." --name "KeyboardOverlay" server.py

    - name: 上传生成的 EXE 文件
      uses: actions/upload-artifact@v4
      with:
        name: KeyboardOverlay-Windows-Build
        path: dist/KeyboardOverlay.exe